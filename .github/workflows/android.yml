name: Android-App bauen

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Spiel zusammenbauen und Schriften einbetten
        run: python3 tools/build.py --embed-fonts

      - name: APK bauen
        run: gradle assembleRelease --no-daemon

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk Libero91-${{ github.run_number }}.apk

      - name: APK als Build-Ergebnis speichern
        uses: actions/upload-artifact@v4
        with:
          name: Libero91-${{ github.run_number }}
          path: Libero91-${{ github.run_number }}.apk

      - name: Release zum Herunterladen anlegen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Libero '91 – Version 0.${{ github.run_number }}
          body: |
            Neue Version vom Stand ${{ github.sha }}.
            Auf dem Handy: APK herunterladen, öffnen, installieren. Der Spielstand bleibt bei Updates erhalten.
          files: Libero91-${{ github.run_number }}.apk
          make_latest: true
